<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Sales Call Records - Murf AI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
      }
      .card {
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
      }
      .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px 15px 0 0 !important;
        padding: 20px;
      }
      .stat-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .stat-value {
        font-size: 2.5rem;
        font-weight: bold;
        color: #667eea;
      }
      .stat-label {
        color: #666;
        font-size: 0.9rem;
        margin-top: 5px;
      }
      .call-row {
        background: white;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 10px;
        border-left: 5px solid #667eea;
        transition: all 0.3s;
      }
      .call-row:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .badge-success {
        background-color: #28a745 !important;
      }
      .badge-warning {
        background-color: #ffc107 !important;
      }
      .badge-danger {
        background-color: #dc3545 !important;
      }
      .badge-info {
        background-color: #17a2b8 !important;
      }
      .filter-btn {
        margin: 5px;
      }
      .search-box {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="card">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h2>
                <i class="fas fa-phone-volume me-2"></i>B2B Sales Call Records
              </h2>
              <p class="mb-0">
                Murf AI Voice Synthesis API - Sales Performance
              </p>
            </div>
            <div>
              <a href="/" class="btn btn-light me-2"
                ><i class="fas fa-home me-1"></i>Home</a
              >
              <a href="/sales" class="btn btn-light me-2"
                ><i class="fas fa-headset me-1"></i>Make Call</a
              >
              <button class="btn btn-light" onclick="location.reload()">
                <i class="fas fa-sync me-1"></i>Refresh
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="row mb-4">
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value" id="totalCalls">0</div>
            <div class="stat-label">
              <i class="fas fa-phone me-1"></i>Total Calls
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-success" id="interested">0</div>
            <div class="stat-label">
              <i class="fas fa-thumbs-up me-1"></i>Interested
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-warning" id="followUp">0</div>
            <div class="stat-label">
              <i class="fas fa-clock me-1"></i>Follow-up Needed
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-info" id="avgDuration">0s</div>
            <div class="stat-label">
              <i class="fas fa-stopwatch me-1"></i>Avg Duration
            </div>
          </div>
        </div>
      </div>

      <!-- Search and Filters -->
      <div class="search-box">
        <div class="row">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="searchInput"
              placeholder="🔍 Search by customer name, phone, or keywords..."
            />
          </div>
          <div class="col-md-6">
            <button
              class="btn btn-primary filter-btn"
              onclick="filterCalls('all')"
            >
              All
            </button>
            <button
              class="btn btn-success filter-btn"
              onclick="filterCalls('interested')"
            >
              Interested
            </button>
            <button
              class="btn btn-warning filter-btn"
              onclick="filterCalls('neutral')"
            >
              Neutral
            </button>
            <button
              class="btn btn-danger filter-btn"
              onclick="filterCalls('not_interested')"
            >
              Not Interested
            </button>
            <button
              class="btn btn-info filter-btn"
              onclick="filterCalls('follow_up')"
            >
              Follow-up
            </button>
          </div>
        </div>
      </div>

      <!-- Call Records -->
      <div class="card">
        <div class="card-header">
          <h4><i class="fas fa-list me-2"></i>Call History</h4>
        </div>
        <div class="card-body" style="max-height: 600px; overflow-y: auto">
          <div id="callRecords">
            <!-- Records will be loaded here -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let allCalls = [];
      let currentFilter = "all";

      async function loadCallRecords() {
        try {
          // ⚡ NEW: Load from local storage API
          const response = await fetch("/api/records/b2b_sales?limit=100");
          const data = await response.json();

          if (data.status === "success") {
            allCalls = data.records || [];
            updateStats(data.stats, allCalls);
            displayCalls(allCalls);
          } else {
            throw new Error("Failed to load records");
          }
        } catch (error) {
          console.error("Error loading call records:", error);
          document.getElementById("callRecords").innerHTML =
            '<div class="alert alert-danger">Error loading records. Please try again.</div>';
        }
      }

      function updateStats(stats, calls) {
        // Update from local storage stats
        document.getElementById("totalCalls").textContent =
          stats.total_calls || 0;
        document.getElementById("avgDuration").textContent =
          Math.floor(stats.avg_duration || 0) + "s";

        // Calculate interested and follow-up from calls
        const interested = calls.filter(
          (c) => c.interest_level === "high" || c.lead_score >= 7
        ).length;
        document.getElementById("interested").textContent = interested;

        const followUp = calls.filter(
          (c) => c.lead_score >= 5 && c.lead_score < 7
        ).length;
        document.getElementById("followUp").textContent = followUp;
      }

      function displayCalls(calls) {
        const container = document.getElementById("callRecords");

        if (calls.length === 0) {
          container.innerHTML =
            '<div class="alert alert-info">No call records found.</div>';
          return;
        }

        const html = calls
          .map((call) => {
            // ⚡ Updated to use local storage field names
            const sentimentBadge = getSentimentBadge(
              call.interest_level || call.summary?.interest_level
            );
            const statusBadge = getStatusBadge(call.status);
            const date = new Date(
              call.end_time || call.timestamp
            ).toLocaleString();
            const duration = call.duration_seconds || 0;
            const leadScore = call.lead_score || call.summary?.lead_score || 0;

            return `
                    <div class="call-row" data-sentiment="${
                      call.interest_level
                    }" data-status="${call.status}">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <h6 class="mb-1"><i class="fas fa-user me-2"></i>${
                                  call.customer_name || "Unknown"
                                }</h6>
                                <small class="text-muted"><i class="fas fa-envelope me-1"></i>${
                                  call.customer_email || "N/A"
                                }</small>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted"><i class="fas fa-calendar me-1"></i>${date}</small>
                            </div>
                            <div class="col-md-2">
                                ${sentimentBadge}
                                ${statusBadge}
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-secondary"><i class="fas fa-clock me-1"></i>${duration}s</span>
                                <span class="badge bg-info">Score: ${leadScore}/10</span>
                            </div>
                            <div class="col-md-3 text-end">
                                <button class="btn btn-sm btn-outline-secondary" onclick="viewDetails('${
                                  call.call_sid
                                }')"><i class="fas fa-info-circle me-1"></i>Details</button>
                            </div>
                        </div>
                        ${
                          call.next_steps
                            ? `<div class="mt-2"><small><i class="fas fa-comment-dots me-1"></i><strong>Next:</strong> ${call.next_steps}</small></div>`
                            : ""
                        }
                    </div>
                `;
          })
          .join("");

        container.innerHTML = html;
      }

      function getSentimentBadge(sentiment) {
        const badges = {
          high: '<span class="badge badge-success"><i class="fas fa-smile me-1"></i>High Interest</span>',
          medium:
            '<span class="badge badge-warning"><i class="fas fa-meh me-1"></i>Medium Interest</span>',
          low: '<span class="badge badge-danger"><i class="fas fa-frown me-1"></i>Low Interest</span>',
          // Legacy support
          interested:
            '<span class="badge badge-success"><i class="fas fa-smile me-1"></i>Interested</span>',
          neutral:
            '<span class="badge badge-warning"><i class="fas fa-meh me-1"></i>Neutral</span>',
          not_interested:
            '<span class="badge badge-danger"><i class="fas fa-frown me-1"></i>Not Interested</span>',
        };
        return (
          badges[sentiment] || '<span class="badge bg-secondary">Unknown</span>'
        );
      }

      function getStatusBadge(status) {
        const badges = {
          completed:
            '<span class="badge badge-success"><i class="fas fa-check me-1"></i>Completed</span>',
          follow_up_needed:
            '<span class="badge badge-info"><i class="fas fa-redo me-1"></i>Follow-up</span>',
          demo_scheduled:
            '<span class="badge badge-success"><i class="fas fa-calendar-check me-1"></i>Demo</span>',
          closed:
            '<span class="badge bg-secondary"><i class="fas fa-times me-1"></i>Closed</span>',
        };
        return badges[status] || "";
      }

      function filterCalls(filter) {
        currentFilter = filter;

        if (filter === "all") {
          displayCalls(allCalls);
        } else {
          const filtered = allCalls.filter((call) => {
            if (filter === "follow_up")
              return call.lead_score >= 5 && call.lead_score < 7;
            if (filter === "interested")
              return call.interest_level === "high" || call.lead_score >= 7;
            return call.interest_level === filter;
          });
          displayCalls(filtered);
        }
      }

      // Search functionality
      document.getElementById("searchInput").addEventListener("input", (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = allCalls.filter((call) => {
          return (
            (call.customer_name || "").toLowerCase().includes(searchTerm) ||
            (call.customer_phone || "").toLowerCase().includes(searchTerm) ||
            (call.conversation_summary || "").toLowerCase().includes(searchTerm)
          );
        });
        displayCalls(filtered);
      });

      function viewDetails(callSid) {
        alert(
          "Call Details for: " + callSid + "\n\nDetailed view coming soon!"
        );
      }

      // Load records on page load
      loadCallRecords();

      // Auto-refresh every 30 seconds
      setInterval(loadCallRecords, 30000);
    </script>
  </body>
</html>
