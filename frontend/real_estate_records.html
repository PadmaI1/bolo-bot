<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Call Records - Property AI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
      }
      .card {
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
      }
      .card-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        border-radius: 15px 15px 0 0 !important;
        padding: 20px;
      }
      .stat-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .stat-value {
        font-size: 2.5rem;
        font-weight: bold;
        color: #1e3c72;
      }
      .stat-label {
        color: #666;
        font-size: 0.9rem;
        margin-top: 5px;
      }
      .call-row {
        background: white;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 10px;
        border-left: 5px solid #1e3c72;
        transition: all 0.3s;
      }
      .call-row:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .badge-success {
        background-color: #28a745 !important;
      }
      .badge-warning {
        background-color: #ffc107 !important;
      }
      .badge-danger {
        background-color: #dc3545 !important;
      }
      .badge-info {
        background-color: #17a2b8 !important;
      }
      .filter-btn {
        margin: 5px;
      }
      .search-box {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
      }
      .property-tag {
        background: #e3f2fd;
        color: #1976d2;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 0.85rem;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="card">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h2>
                <i class="fas fa-building me-2"></i>Real Estate Call Records
              </h2>
              <p class="mb-0">
                Property Consultation & Lead Management - Hyderabad
              </p>
            </div>
            <div>
              <a href="/" class="btn btn-light me-2"
                ><i class="fas fa-home me-1"></i>Home</a
              >
              <a href="/real-estate" class="btn btn-light me-2"
                ><i class="fas fa-headset me-1"></i>Make Call</a
              >
              <button class="btn btn-light" onclick="location.reload()">
                <i class="fas fa-sync me-1"></i>Refresh
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="row mb-4">
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value" id="totalCalls">0</div>
            <div class="stat-label">
              <i class="fas fa-phone me-1"></i>Total Calls
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-success" id="hotLeads">0</div>
            <div class="stat-label">
              <i class="fas fa-fire me-1"></i>Hot Leads
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-warning" id="siteVisits">0</div>
            <div class="stat-label">
              <i class="fas fa-calendar-check me-1"></i>Site Visits
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="stat-value text-info" id="avgLeadScore">0</div>
            <div class="stat-label">
              <i class="fas fa-star me-1"></i>Avg Lead Score
            </div>
          </div>
        </div>
      </div>

      <!-- Search and Filters -->
      <div class="search-box">
        <div class="row">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="searchInput"
              placeholder="🔍 Search by name, phone, location, or property type..."
            />
          </div>
          <div class="col-md-6">
            <button
              class="btn btn-primary filter-btn"
              onclick="filterCalls('all')"
            >
              All
            </button>
            <button
              class="btn btn-success filter-btn"
              onclick="filterCalls('interested')"
            >
              Interested
            </button>
            <button
              class="btn btn-warning filter-btn"
              onclick="filterCalls('neutral')"
            >
              Neutral
            </button>
            <button
              class="btn btn-danger filter-btn"
              onclick="filterCalls('not_interested')"
            >
              Not Interested
            </button>
            <button
              class="btn btn-info filter-btn"
              onclick="filterCalls('site_visit')"
            >
              Site Visits
            </button>
          </div>
        </div>
      </div>

      <!-- Call Records -->
      <div class="card">
        <div class="card-header">
          <h4><i class="fas fa-list me-2"></i>Call History</h4>
        </div>
        <div class="card-body" style="max-height: 600px; overflow-y: auto">
          <div id="callRecords">
            <!-- Records will be loaded here -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let allCalls = [];
      let currentFilter = "all";

      async function loadCallRecords() {
        try {
          // ⚡ NEW: Load from local storage API
          const response = await fetch("/api/records/real_estate?limit=100");
          const data = await response.json();

          if (data.status === "success") {
            allCalls = data.records || [];
            updateStats(data.stats, allCalls);
            displayCalls(allCalls);
          } else {
            throw new Error("Failed to load records");
          }
        } catch (error) {
          console.error("Error loading call records:", error);
          document.getElementById("callRecords").innerHTML =
            '<div class="alert alert-danger">Error loading records. Please try again.</div>';
        }
      }

      function updateStats(stats, calls) {
        // Update from local storage stats
        document.getElementById("totalCalls").textContent =
          stats.total_calls || 0;

        // Calculate hot leads and site visits from calls
        const hotLeads = calls.filter(
          (c) => (c.lead_score || c.summary?.qualification_score || 0) >= 7
        ).length;
        document.getElementById("hotLeads").textContent = hotLeads;

        const siteVisits = calls.filter((c) =>
          c.next_steps?.toLowerCase().includes("site visit")
        ).length;
        document.getElementById("siteVisits").textContent = siteVisits;

        const avgScore = stats.avg_lead_score || 0;
        document.getElementById("avgLeadScore").textContent =
          avgScore.toFixed(1);
      }

      function displayCalls(calls) {
        const container = document.getElementById("callRecords");

        if (calls.length === 0) {
          container.innerHTML =
            '<div class="alert alert-info">No call records found.</div>';
          return;
        }

        const html = calls
          .map((call) => {
            // Use interest_level instead of sentiment
            const interestBadge = getSentimentBadge(call.interest_level);
            const leadScoreBadge = getLeadScoreBadge(call.lead_score || 0);
            const date = new Date(call.end_time).toLocaleString();
            const duration = call.duration_seconds || 0;

            // Extract property info from summary
            const propertyType = call.summary?.property_type || "N/A";
            const budgetRange = call.summary?.budget_range || "N/A";
            const location =
              call.summary?.preferred_locations?.join(", ") || "N/A";

            return `
                    <div class="call-row" data-sentiment="${
                      call.interest_level
                    }" data-status="active">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <h6 class="mb-1"><i class="fas fa-user me-2"></i>${
                                  call.customer_name || "Unknown"
                                }</h6>
                                <small class="text-muted"><i class="fas fa-envelope me-1"></i>${
                                  call.customer_email || "N/A"
                                }</small>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted"><i class="fas fa-calendar me-1"></i>${date}</small>
                            </div>
                            <div class="col-md-2">
                                ${interestBadge}
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-secondary"><i class="fas fa-clock me-1"></i>${duration}s</span>
                                ${leadScoreBadge}
                            </div>
                            <div class="col-md-3 text-end">
                                ${
                                  call.recording_url
                                    ? `<a href="${call.recording_url}" class="btn btn-sm btn-primary" target="_blank"><i class="fas fa-play me-1"></i>Recording</a>`
                                    : ""
                                }
                                <button class="btn btn-sm btn-outline-secondary" onclick="viewDetails('${
                                  call.call_sid
                                }')"><i class="fas fa-info-circle me-1"></i>Details</button>
                            </div>
                        </div>
                        <div class="mt-2">
                            <span class="badge bg-info me-2"><i class="fas fa-home me-1"></i>${propertyType}</span>
                            <span class="badge bg-success me-2"><i class="fas fa-rupee-sign me-1"></i>${budgetRange}</span>
                            <span class="badge bg-warning"><i class="fas fa-map-marker-alt me-1"></i>${location}</span>
                        </div>
                        ${
                          call.next_steps
                            ? `<div class="mt-2"><small><i class="fas fa-tasks me-1"></i><strong>Next Steps:</strong> ${call.next_steps}</small></div>`
                            : ""
                        }
                    </div>
                `;
          })
          .join("");

        container.innerHTML = html;
      }

      function getSentimentBadge(interestLevel) {
        const badges = {
          high: '<span class="badge badge-success"><i class="fas fa-fire me-1"></i>High Interest</span>',
          medium:
            '<span class="badge badge-warning"><i class="fas fa-star me-1"></i>Medium Interest</span>',
          low: '<span class="badge badge-info"><i class="fas fa-snowflake me-1"></i>Low Interest</span>',
          // Backwards compatibility with old sentiment values
          interested:
            '<span class="badge badge-success"><i class="fas fa-smile me-1"></i>Interested</span>',
          neutral:
            '<span class="badge badge-warning"><i class="fas fa-meh me-1"></i>Neutral</span>',
          not_interested:
            '<span class="badge badge-danger"><i class="fas fa-frown me-1"></i>Not Interested</span>',
          objection:
            '<span class="badge bg-secondary"><i class="fas fa-question me-1"></i>Objection</span>',
        };
        return (
          badges[interestLevel] ||
          '<span class="badge bg-secondary">Unknown</span>'
        );
      }

      function getStatusBadge(status) {
        const badges = {
          site_visit_scheduled:
            '<span class="badge badge-info"><i class="fas fa-calendar-check me-1"></i>Site Visit</span>',
          follow_up_needed:
            '<span class="badge badge-warning"><i class="fas fa-redo me-1"></i>Follow-up</span>',
          closed:
            '<span class="badge bg-secondary"><i class="fas fa-times me-1"></i>Closed</span>',
        };
        return badges[status] || "";
      }

      function getLeadScoreBadge(score) {
        if (score >= 8)
          return (
            '<span class="badge" style="background: #f44336;"><i class="fas fa-fire me-1"></i>Hot ' +
            score +
            "/10</span>"
          );
        if (score >= 6)
          return (
            '<span class="badge badge-warning"><i class="fas fa-star me-1"></i>Warm ' +
            score +
            "/10</span>"
          );
        if (score >= 4)
          return (
            '<span class="badge badge-info"><i class="fas fa-snowflake me-1"></i>Cold ' +
            score +
            "/10</span>"
          );
        return '<span class="badge bg-secondary">' + score + "/10</span>";
      }

      function extractPropertyInfo(summary) {
        const tags = [];
        const lowerSummary = summary.toLowerCase();

        // Property types
        if (lowerSummary.includes("villa"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-home me-1"></i>Villa</span>'
          );
        if (lowerSummary.includes("apartment") || lowerSummary.includes("flat"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-building me-1"></i>Apartment</span>'
          );
        if (lowerSummary.includes("plot") || lowerSummary.includes("land"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map me-1"></i>Plot</span>'
          );

        // Locations in Hyderabad
        if (lowerSummary.includes("jubilee hills"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map-marker-alt me-1"></i>Jubilee Hills</span>'
          );
        if (lowerSummary.includes("banjara hills"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map-marker-alt me-1"></i>Banjara Hills</span>'
          );
        if (lowerSummary.includes("gachibowli"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map-marker-alt me-1"></i>Gachibowli</span>'
          );
        if (lowerSummary.includes("madhapur"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map-marker-alt me-1"></i>Madhapur</span>'
          );
        if (lowerSummary.includes("kondapur"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-map-marker-alt me-1"></i>Kondapur</span>'
          );

        // Budget indicators
        if (lowerSummary.includes("crore"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-rupee-sign me-1"></i>Premium</span>'
          );
        if (lowerSummary.includes("lakh"))
          tags.push(
            '<span class="property-tag"><i class="fas fa-rupee-sign me-1"></i>Budget</span>'
          );

        return tags.join(" ");
      }

      function filterCalls(filter) {
        currentFilter = filter;

        if (filter === "all") {
          displayCalls(allCalls);
        } else if (filter === "site_visit") {
          const filtered = allCalls.filter(
            (call) =>
              call.next_steps &&
              call.next_steps.toLowerCase().includes("site visit")
          );
          displayCalls(filtered);
        } else {
          const filtered = allCalls.filter(
            (call) => call.interest_level === filter
          );
          displayCalls(filtered);
        }
      }

      // Search functionality
      document.getElementById("searchInput").addEventListener("input", (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = allCalls.filter((call) => {
          return (
            (call.customer_name || "").toLowerCase().includes(searchTerm) ||
            (call.customer_email || "").toLowerCase().includes(searchTerm) ||
            (call.next_steps || "").toLowerCase().includes(searchTerm) ||
            (call.summary?.property_type || "")
              .toLowerCase()
              .includes(searchTerm) ||
            (call.summary?.preferred_locations?.join(" ") || "")
              .toLowerCase()
              .includes(searchTerm)
          );
        });
        displayCalls(filtered);
      });

      function viewDetails(callSid) {
        alert(
          "Call Details for: " + callSid + "\n\nDetailed view coming soon!"
        );
      }

      // Load records on page load
      loadCallRecords();

      // Auto-refresh every 30 seconds
      setInterval(loadCallRecords, 30000);
    </script>
  </body>
</html>
